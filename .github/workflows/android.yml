name: Build TRINX APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto
        run: |
          mkdir -p source
          unzip -q TRINX_Android_Starter_v0.2.0.zip -d source
          find source -name settings.gradle.kts

      - name: Compilar APK
        run: |
          PROJECT=$(dirname "$(find source -name settings.gradle.kts | head -n 1)")
          cd "$PROJECT"
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: TRINX-APK
          path: source/**/build/outputs/apk/debug/*.apk
